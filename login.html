<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | VibeVerse</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gradient-to-br from-black via-purple-950 to-black
text-white min-h-screen flex items-center justify-center px-6">


<div class="bg-zinc-900 p-10 rounded-3xl w-full max-w-md border border-purple-900">

<h1 class="text-4xl font-bold text-center">

Welcome Back 👋

</h1>

<p class="text-gray-400 text-center mt-3">

Login to continue exploring events.

</p>


<form class="mt-8 space-y-5">


<input
type="email"
placeholder="Email Address"
class="w-full p-4 rounded-xl bg-black border border-gray-700">


<input
type="password"
placeholder="Password"
class="w-full p-4 rounded-xl bg-black border border-gray-700">


<button
class="w-full bg-purple-600 py-4 rounded-xl font-bold hover:bg-purple-700">

Login 🚀

</button>


<p class="text-center text-gray-400">

Don't have an account?

<a href="#" class="text-purple-400">

Sign Up

</a>

</p>


</form>

</div>


</body>
</html>
